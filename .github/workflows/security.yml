name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  trivy-scan:
    name: "Stage 1: Trivy Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  owasp-scan:
    name: "Stage 2: OWASP Dependency-Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: devops-academy
          path: .
          format: HTML
          args: >
            --failOnCVSS 7
            --enableExperimental
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports

  sonarqube-scan:
    name: "Stage 3: SonarQube Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan (self-hosted)
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          args: -Dsonar.projectKey=devops-academy -Dsonar.sources=backend,frontend/src
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}