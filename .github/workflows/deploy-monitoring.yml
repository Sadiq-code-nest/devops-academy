name: Deploy Monitoring Stack

on:
  push:
    branches: [main]
    paths:
      - "observability/**"
      - ".github/workflows/deploy-monitoring.yml"
  workflow_dispatch:

jobs:
  deploy-monitoring-server:
    name: "Deploy Prometheus + Grafana"
    runs-on: ubuntu-latest
    env:
      APP_SERVER_IP: ${{ secrets.APP_SERVER_IP }}
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
    steps:
      - name: Deploy to monitoring server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MONITORING_SERVER_HOST }}
          username: ${{ secrets.MONITORING_SERVER_USER }}
          password: ${{ secrets.MONITORING_SERVER_PASSWORD }}
          port: ${{ secrets.MONITORING_SERVER_PORT }}
          envs: APP_SERVER_IP,GRAFANA_ADMIN_PASSWORD
          script: |
            set -e
            REPO_DIR=$HOME/devops-academy
              if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              rm -f observability/prometheus/prometheus.yml
              git pull origin main
            else
              git clone https://github.com/Sadiq-code-nest/devops-academy.git "$REPO_DIR"
              cd "$REPO_DIR"
            fi
            cd observability
            sed "s/__APP_SERVER_IP__/${APP_SERVER_IP}/" prometheus/prometheus.yml.template > prometheus/prometheus.yml
            echo "GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}" > .env
            docker compose -f docker-compose.monitoring.yml up -d --force-recreate prometheus loki grafana
            docker compose -f docker-compose.monitoring.yml ps

  deploy-node-exporter:
    name: "Deploy Node Exporter"
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to app server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            REPO_DIR=$HOME/devops-academy
            cd "$REPO_DIR" && git pull origin main
            cd observability/node-exporter
            docker compose -f docker-compose.node-exporter.yml up -d
            docker compose -f docker-compose.node-exporter.yml ps
            cd "$REPO_DIR/observability/cadvisor"
            docker compose -f docker-compose.cadvisor.yml up -d
            docker compose -f docker-compose.cadvisor.yml ps