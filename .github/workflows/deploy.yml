name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          envs: MONGO_ROOT_USER,MONGO_ROOT_PASSWORD,JWT_SECRET,ADMIN_USERNAME,ADMIN_PASSWORD,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,PUBLIC_URL
          script: |
            set -e

            REPO_DIR=/home/sadiq/devops-academy

            if [ -d "$REPO_DIR/.git" ]; then
              echo "== Repo exists, pulling latest =="
              cd "$REPO_DIR"
              git pull origin main
            else
              echo "== First run, cloning repo =="
              git clone https://github.com/Sadiq-code-nest/devops-academy.git "$REPO_DIR"
              cd "$REPO_DIR"
            fi

            echo "== Writing backend/.env from secrets =="
            cat > backend/.env << ENVEOF
            PORT=5000
            NODE_ENV=production
            CLIENT_URL=${PUBLIC_URL}:8080

            MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
            MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
            MONGO_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/devops_academy?authSource=admin

            JWT_SECRET=${JWT_SECRET}

            ADMIN_USERNAME=${ADMIN_USERNAME}
            ADMIN_PASSWORD=${ADMIN_PASSWORD}

            SMTP_HOST=${SMTP_HOST}
            SMTP_PORT=${SMTP_PORT}
            SMTP_USER=${SMTP_USER}
            SMTP_PASS=${SMTP_PASS}
            SMTP_FROM=${SMTP_USER}
            ENVEOF

            echo "== Writing frontend/.env from secrets =="
            cat > frontend/.env << ENVEOF
            VITE_API_URL=${PUBLIC_URL}:5000/api
            ENVEOF

            echo "== Patching build-arg in docker-compose.yml =="
            sed -i -E "s#VITE_API_URL: \"[^\"]+\"#VITE_API_URL: \"${PUBLIC_URL}:5000/api\"#" docker-compose.yml

            echo "== Rebuilding and restarting =="
            export COMPOSE_BAKE=false
            docker compose build --no-cache
            docker compose up -d

            echo "== Cleaning up old images =="
            docker image prune -f

            echo "== Final status =="
            docker compose ps