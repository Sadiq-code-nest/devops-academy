apiVersion: v1
kind: ServiceAccount
metadata:
  name: academy-sa
  namespace: {{ .Values.namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: academy-role
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: academy-rolebinding
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: academy-sa
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: academy-role
  apiGroup: rbac.authorization.k8s.io
