apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: academy-ingress
  namespace: devops-academy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - app.sadiqdev.online
      secretName: academy-tls
  rules:
    - host: app.sadiqdev.online
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 5000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 8080 } }