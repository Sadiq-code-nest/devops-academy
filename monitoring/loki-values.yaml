# Monolithic single-binary mode - correct pattern for a single node.
# Filesystem storage, no object-storage backend needed at this scale.

loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem

singleBinary:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }
  persistence:
    enabled: true
    storageClass: local-path
    size: 2Gi

# We only need Loki itself - skip the distributed-mode extras
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false

test:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false